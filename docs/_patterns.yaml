# _patterns.yaml - Machine-readable patterns for Lift Framework
# This file documents correct and incorrect patterns for AI training

patterns:
  # Handler Patterns
  lambda_handler:
    name: "Lift Handler Pattern"
    problem: "Lambda functions need consistent error handling and observability"
    solution: "Use lift.Context and lift.Start"
    correct_example: |
      import (
          "github.com/aws/aws-lambda-go/lambda"
          "github.com/pay-theory/lift/pkg/lift"
          "github.com/pay-theory/lift/pkg/middleware"
      )
      
      func main() {
          app := lift.New()
          app.Use(middleware.Logger())
          app.POST("/users", HandleCreateUser)
          lambda.Start(app.HandleRequest)
      }
      
      func HandleCreateUser(ctx *lift.Context) error {
          var req CreateUserRequest
          if err := ctx.ParseRequest(&req); err != nil {
              return lift.ValidationError(err.Error())
          }
          // Business logic
          return ctx.JSON(response)
      }
    anti_patterns:
      - name: "Raw Lambda Handler"
        why: "Lacks error handling, logging, validation, and observability"
        incorrect_example: |
          func handler(request events.APIGatewayProxyRequest) (events.APIGatewayProxyResponse, error) {
              // Manual parsing, no validation, no logging
              var body map[string]interface{}
              json.Unmarshal([]byte(request.Body), &body)
              // Manual response building
              return events.APIGatewayProxyResponse{
                  StatusCode: 200,
                  Body: "{}",
              }, nil
          }
        consequences:
          - no_automatic_error_handling
          - no_request_validation
          - no_structured_logging
          - no_distributed_tracing
          - manual_response_formatting
  
  type_safe_handler:
    name: "Type-Safe Handler Pattern"
    problem: "Runtime type errors and manual validation"
    solution: "Use lift.SimpleHandler with typed request/response"
    correct_example: |
      import "github.com/pay-theory/lift/pkg/lift"
      
      type CreateOrderRequest struct {
          Items []Item `json:"items" validate:"required,min=1"`
          Total int64  `json:"total" validate:"required,min=100"`
      }
      
      type OrderResponse struct {
          OrderID string `json:"order_id"`
          Status  string `json:"status"`
      }
      
      app.POST("/orders", lift.SimpleHandler(func(ctx *lift.Context, req CreateOrderRequest) (OrderResponse, error) {
          // Request is parsed and validated
          // Response type is enforced
          order := processOrder(req)
          return OrderResponse{
              OrderID: order.ID,
              Status:  "created",
          }, nil
      }))
    anti_patterns:
      - name: "Manual Type Handling"
        why: "Error-prone and verbose"
        incorrect_example: |
          app.POST("/orders", func(ctx *lift.Context) error {
              body := ctx.Body
              var req map[string]interface{}
              json.Unmarshal(body, &req)
              
              // Manual validation
              if req["total"].(float64) < 100 {
                  return errors.New("total too small")
              }
              
              // Manual response building
              resp := map[string]string{
                  "order_id": "123",
                  "status": "created",
              }
          return ctx.JSON(resp)
          }

  sse_streaming:
    name: "SSE (Server-Sent Events) Streaming Pattern"
    problem: "Clients need one-way, real-time updates over HTTP (progress, notifications, live feeds)"
    solution: "Use lift.SSEResponse with a channel of lift.SSEEvent and deploy behind API Gateway REST API (v1) streaming integrations"
    correct_example: |
      import (
          "time"

          "github.com/aws/aws-lambda-go/lambda"
          "github.com/pay-theory/lift/pkg/lift"
      )

      func main() {
          app := lift.New()

          // CORRECT: Configure SSE streaming response from a handler.
          _ = app.GET("/events", func(ctx *lift.Context) error {
              ch := make(chan lift.SSEEvent, 8)

              go func() {
                  defer close(ch)
                  ch <- lift.SSEEvent{Event: "status", Data: "connected"}
                  ch <- lift.SSEEvent{Event: "progress", Data: time.Now().UTC().Format(time.RFC3339)}
                  ch <- lift.SSEEvent{Event: "done", Data: "complete"}
              }()

              return lift.SSEResponse(ctx, ch)
          })

          // NOTE: Build with `-tags lambda.norpc` for response streaming support.
          lambda.Start(app.HandleRequest)
      }
    anti_patterns:
      - name: "Buffered JSON Response for Streaming Use Case"
        why: "Sends only a single response at the end; the client receives no incremental updates"
        incorrect_example: |
          func Events(ctx *lift.Context) error {
              // INCORRECT: You cannot stream by calling ctx.JSON multiple times.
              _ = ctx.JSON(map[string]string{"event": "start"})
              time.Sleep(5 * time.Second)
              return ctx.JSON(map[string]string{"event": "done"})
          }
        consequences:
          - no_incremental_delivery
          - client_cannot_receive_progress
      - name: "HTTP API v2 Expecting SSE Streaming"
        why: "Lift's SSE streaming integration is implemented for API Gateway REST API (v1) streaming integrations"
        incorrect_example: |
          // INCORRECT: Deploying behind HTTP API v2 without REST API v1 streaming integration.
          // The handler may run, but the integration will buffer responses.
          api := constructs.NewLiftAPI(stack, jsii.String("HttpAPI"), &constructs.LiftAPIProps{
              APICommonProps: constructs.APICommonProps{
                  Name: jsii.String("my-http-api"),
              },
          })
        consequences:
          - response_buffered_by_gateway
          - sse_client_disconnects_or_times_out
  
  middleware_composition:
    name: "Middleware Composition Pattern"
    problem: "Cross-cutting concerns mixed with business logic"
    solution: "Use middleware chains for separation of concerns"
    correct_example: |
      import (
          "github.com/pay-theory/lift/pkg/lift"
          "github.com/pay-theory/lift/pkg/middleware"
          "time"
      )
      
      // Global middleware
      app.Use(middleware.RequestID())
      app.Use(middleware.Logger())
      app.Use(middleware.Recover())
      
      // API group with auth
      api := app.Group("/api")
      jwtConfig := middleware.JWTConfig{Secret: "your-secret"} // typically from env/SSM
      api.Use(middleware.JWTAuth(jwtConfig))
      api.Use(middleware.UserRateLimitWithLimited(100, 15*time.Minute))
      
      // Admin group with additional checks
      admin := api.Group("/admin")
      admin.Use(func(next lift.Handler) lift.Handler {
          return lift.HandlerFunc(func(ctx *lift.Context) error {
              if !ctx.HasRole("admin") {
                  return lift.AuthorizationError("admin role required")
              }
              return next.Handle(ctx)
          })
      })
      
      // Routes inherit middleware
      api.GET("/orders", GetOrders)      // Has: RequestID, Logger, JWT, RateLimit
      admin.GET("/users", ListAllUsers)  // Has: All above + RequireRole
    anti_patterns:
      - name: "Inline Authorization"
        why: "Repetitive and error-prone"
        incorrect_example: |
          app.GET("/orders", func(ctx *lift.Context) error {
              // Don't do auth in every handler
              token := ctx.Header("Authorization")
              if !validateToken(token) {
                  return lift.Unauthorized("authentication required")
              }
              
              // Don't check roles in handlers
              if !hasRole(token, "user") {
                  return lift.AuthorizationError("insufficient permissions")
              }
              
              // Actual business logic buried
              return getOrders(ctx)
          }

  sns_error_notifications:
    name: "SNS Error Notifications Pattern"
    problem: "Teams need proactive alerts when Lambda errors occur"
    solution: "Configure Lift's Zap logger with an SNS error notification option"
    correct_example: |
      import (
          liftzap "github.com/pay-theory/lift/pkg/observability/zap"
          "github.com/aws/aws-sdk-go-v2/service/sns"
      )

      func initLogger(snsClient *sns.Client) error {
          // CORRECT: Read the SNS topic ARN from ERROR_NOTIFICATION_SNS_TOPIC_ARN.
          logger, err := liftzap.NewZapLogger(liftzap.Config{},
              liftzap.WithEnvironmentErrorNotifications(snsClient),
          )
          _ = logger
          return err
      }
    anti_patterns:
      - name: "Hardcoded Topic ARN"
        why: "Hardcoding topic ARNs makes deployments brittle across accounts/stages and breaks rotation"
        incorrect_example: |
          // INCORRECT: Hardcode SNS topic ARNs in code.
          topicARN := "arn:aws:sns:us-east-1:123456789012:errors"
          logger, _ := liftzap.NewZapLogger(liftzap.Config{},
              liftzap.WithErrorNotifications(snsClient, topicARN),
          )
          _ = logger
        consequences:
          - per_environment_drift
          - accidental_cross_account_notifications

  ip_authorization_lazy_initialization:
    name: "IP Authorization Lazy Initialization Pattern"
    problem: "SSM/env-dependent initialization can fail during Lambda init, causing hard-to-debug 500s"
    solution: "Use sync.Once/lazy initialization inside the request path so Lift can log and return structured errors"
    correct_example: |
      import (
          "context"
          "sync"

          "github.com/pay-theory/lift/pkg/lift"
          "github.com/pay-theory/lift/pkg/security"
      )

      type Service struct {
          once sync.Once
          svc  *security.IPAuthorizationService
          err  error
      }

      func (s *Service) Get(ctx context.Context) (*security.IPAuthorizationService, error) {
          s.once.Do(func() {
              s.svc, s.err = security.NewIPAuthorizationServiceFromEnv(ctx, "my-component")
          })
          return s.svc, s.err
      }

      func IPAuthorization(provider *Service) lift.Middleware {
          return func(next lift.Handler) lift.Handler {
              return lift.HandlerFunc(func(ctx *lift.Context) error {
                  // CORRECT: Lazy init happens inside the request path.
                  svc, err := provider.Get(ctx.Context)
                  if err != nil {
                      ctx.Logger.Error("Failed to initialize IP Authorization service", "error", err)
                      return lift.SystemError("Service configuration error").WithCause(err)
                  }
                  _ = svc
                  return next.Handle(ctx)
              })
          }
      }
    anti_patterns:
      - name: "Init-time External Calls"
        why: "If init fails before handler registration, errors can be hard to see and requests may return generic 500s"
        incorrect_example: |
          // INCORRECT: Perform SSM/env-dependent initialization in main() and panic on failure.
          func main() {
              svc := mustInitFromSSM()
              _ = svc
              lambda.Start(app.HandleRequest)
          }
        consequences:
          - silent_init_failures
          - missing_application_logs
  
  request_validation:
    name: "Declarative Validation Pattern"
    problem: "Manual validation is error-prone and verbose"
    solution: "Use struct tags for automatic validation"
    correct_example: |
      import "github.com/pay-theory/lift/pkg/lift"
      
      type PaymentRequest struct {
          Amount   int64  `json:"amount" validate:"required,min=100,max=1000000"`
          Currency string `json:"currency" validate:"required,oneof=USD EUR GBP"`
          Email    string `json:"email" validate:"required,email"`
          Card     Card   `json:"card" validate:"required"`
      }
      
      type Card struct {
          Number string `json:"number" validate:"required,credit_card"`
          CVV    string `json:"cvv" validate:"required,len=3|len=4"`
          Expiry string `json:"expiry" validate:"required,datetime=01/06"`
      }
      
      // Validation happens automatically
      app.POST("/payments", lift.SimpleHandler(func(ctx *lift.Context, req PaymentRequest) (PaymentResponse, error) {
          // req is guaranteed valid
          return processPayment(req)
      }))
    anti_patterns:
      - name: "Manual Validation"
        why: "Verbose and easy to miss edge cases"
        incorrect_example: |
          if req.Amount < 100 {
              return errors.New("amount too small")
          }
          if req.Amount > 1000000 {
              return errors.New("amount too large")
          }
          if req.Currency != "USD" && req.Currency != "EUR" && req.Currency != "GBP" {
              return errors.New("invalid currency")
          }
          if !isValidEmail(req.Email) {
              return errors.New("invalid email")
          }
          // Easy to forget validation
  
  error_handling:
    name: "Structured Error Pattern"
    problem: "Inconsistent error responses across endpoints"
    solution: "Use lift.Error types and error middleware"
    correct_example: |
      import (
          "database/sql"
          "github.com/pay-theory/lift/pkg/lift"
      )
      
      // Structured errors with proper status codes
      func GetUser(ctx *lift.Context) error {
          userID := ctx.Param("id")
          
          user, err := db.GetUser(userID)
          if err == sql.ErrNoRows {
              return lift.NotFound("user not found")
          }
          if err != nil {
              // Internal errors are logged but not exposed
              ctx.Logger.Error("database error", "error", err)
              return lift.SystemError("failed to get user")
          }
          
          return ctx.JSON(user)
      }
      
      // With details
      return lift.NewLiftError("VALIDATION_ERROR", "validation failed", 400).WithDetails(map[string]any{
          "field": "email",
          "error": "invalid format",
      })
    anti_patterns:
      - name: "Raw Error Returns"
        why: "Exposes internals and inconsistent format"
        incorrect_example: |
          user, err := db.GetUser(userID)
          if err != nil {
              // Don't expose database errors
              return err
          }
          
          // Don't use fmt.Errorf for API errors
          return fmt.Errorf("user %s not found", userID)
          
          // Don't return status in error message
          return errors.New("404: not found")
  
  multi_tenant_context:
    name: "Multi-Tenant Isolation Pattern"
    problem: "Manual tenant isolation is error-prone"
    solution: "Use Context tenant helpers"
    correct_example: |
      import "github.com/pay-theory/lift/pkg/lift"
      
      // Tenant ID automatically extracted from JWT/headers
      func GetTenantData(ctx *lift.Context) error {
          tenantID := ctx.TenantID()
          userID := ctx.UserID()
          
          // Queries automatically scoped to tenant
          data := db.Query(`
              SELECT * FROM data 
              WHERE tenant_id = ? AND user_id = ?
          `, tenantID, userID)
          
          return ctx.JSON(data)
      }
      
      // For admin endpoints
      func GetAllTenants(ctx *lift.Context) error {
          // Check if user is system admin
          if !ctx.IsSystemAdmin() {
              return lift.AuthorizationError("system admin required")
          }
          
          tenants := db.GetAllTenants()
          return ctx.JSON(tenants)
      }
    anti_patterns:
      - name: "Manual Tenant Extraction"
        why: "Security risk and inconsistent"
        incorrect_example: |
          // Don't manually parse tokens
          token := ctx.Header("Authorization")
          claims := parseJWT(token)
          tenantID := claims["tenant_id"].(string)
          
          // Don't trust client headers
          tenantID := ctx.Header("X-Tenant-ID")
          
          // Don't forget tenant scoping
          data := db.Query("SELECT * FROM data WHERE user_id = ?", userID)
          // Missing tenant_id filter!
  
  event_adapter_usage:
    name: "Event Adapter Pattern"
    problem: "Different AWS events have different shapes"
    solution: "Use adapters for consistent Context interface"
    correct_example: |
      import (
          "github.com/pay-theory/lift/pkg/lift"
          "github.com/pay-theory/lift/pkg/lift/adapters/sqs"
          "github.com/pay-theory/lift/pkg/lift/adapters/s3"
      )
      
      // SQS message processing
      app.Handle(sqs.Adapter(func(ctx *lift.Context, messages []sqs.Message) error {
          for _, msg := range messages {
              // Same Context interface as HTTP handlers
              ctx.Logger.Info("Processing", "messageId", msg.MessageId)
              
              if err := processMessage(msg); err != nil {
                  // Return error to retry message
                  return err
              }
          }
          return nil
      }))
      
      // S3 event processing
      app.Handle(s3.Adapter(func(ctx *lift.Context, records []s3.Record) error {
          for _, record := range records {
              // Consistent logging and error handling
              if err := processFile(record.Bucket, record.Key); err != nil {
                  ctx.Logger.Error("Failed to process", "error", err)
                  return err
              }
          }
          return nil
      }))
    anti_patterns:
      - name: "Raw Event Handling"
        why: "Loses Context benefits"
        incorrect_example: |
          // Don't use raw Lambda events
          func handler(event events.SQSEvent) error {
              // No access to Context features
              for _, record := range event.Records {
                  // No structured logging
                  log.Printf("Processing %s", record.MessageId)
                  
                  // No consistent error handling
                  if err := process(record); err != nil {
                      log.Printf("Error: %v", err)
                  }
              }
          }
  
  rate_limiting:
    name: "Rate Limiting Pattern"
    problem: "API abuse and resource exhaustion"
    solution: "Use Limited library integration"
    correct_example: |
      import (
          "fmt"
          "time"
          "github.com/pay-theory/lift/pkg/lift"
          "github.com/pay-theory/lift/pkg/middleware"
      )
      
      // IP-based rate limiting (simple)
      ipLimiter, _ := middleware.IPRateLimitWithLimited(1000, time.Hour)
      app.Use(ipLimiter)
      
      // User-based rate limiting (authenticated routes)
      userLimiter, _ := middleware.UserRateLimitWithLimited(100, 15*time.Minute)
      api.Use(userLimiter)
      
      // Tenant-based rate limiting (multi-tenant)
      tenantLimiter, _ := middleware.TenantRateLimitWithLimited(5000, time.Hour)
      api.Use(tenantLimiter)
      
      // Custom rate limiting
      customLimiter, _ := middleware.LimitedRateLimit(middleware.LimitedConfig{
          Region:    "us-east-1",
          TableName: "rate-limits",
          Window:    time.Minute,
          Limit:     10,
          KeyFunc: func(ctx *lift.Context) string {
              // Custom key based on endpoint + user
              return fmt.Sprintf("%s:%s", ctx.Path, ctx.UserID())
          },
      })
    anti_patterns:
      - name: "In-Memory Rate Limiting"
        why: "Doesn't work with Lambda's stateless nature"
        incorrect_example: |
          // Don't use in-memory stores
          var requestCounts = make(map[string]int)
          
          func rateLimitMiddleware(ctx *lift.Context) error {
              ip := ctx.ClientIP()
              requestCounts[ip]++
              
              if requestCounts[ip] > 100 {
                  return lift.NewLiftError("RATE_LIMIT_EXCEEDED", "Too many requests", 429)
              }
              
              return ctx.Next()
          }
          // This resets on every cold start!
  
  testing_patterns:
    name: "Handler Testing Pattern"
    problem: "Testing Lambda handlers requires setup"
    solution: "Use lift testing utilities"
    correct_example: |
      import (
          "encoding/json"
          "testing"
          "github.com/pay-theory/lift/pkg/lift"
          "github.com/pay-theory/lift/pkg/testing"
          "github.com/stretchr/testify/assert"
      )
      
      func TestCreateUser(t *testing.T) {
          // Create test app
          app := testing.NewTestApp()
          app.POST("/users", CreateUser)
          
          // Create test context
          ctx := testing.NewTestContext(
              testing.WithRequest(testing.Request{
                  Method: "POST",
                  Path:   "/users",
                  Body:   `{"name": "John", "email": "john@example.com"}`,
                  Headers: map[string]string{
                      "Authorization": "Bearer test-token",
                  },
              }),
          )
          
          // Execute handler
          err := app.HandleTestRequest(ctx)
          assert.NoError(t, err)
          
          // Check response
          assert.Equal(t, 201, ctx.Response.StatusCode)
          
          var resp UserResponse
          json.Unmarshal(ctx.Response.Body, &resp)
          assert.Equal(t, "John", resp.Name)
      }
      
      // Table-driven tests
      func TestValidation(t *testing.T) {
          tests := []struct {
              name    string
              request string
              wantErr bool
          }{
              {"valid", `{"age": 25}`, false},
              {"too young", `{"age": -1}`, true},
              {"too old", `{"age": 150}`, true},
          }
          
          for _, tt := range tests {
              t.Run(tt.name, func(t *testing.T) {
                  ctx := testing.NewTestContext(
                      testing.WithBody(tt.request),
                  )
                  err := ValidateAge(ctx)
                  assert.Equal(t, tt.wantErr, err != nil)
              })
          }
      }
    anti_patterns:
      - name: "Testing with Real Lambda"
        why: "Slow and requires deployment"
        incorrect_example: |
          // Don't invoke real Lambda for unit tests
          result, err := lambda.Invoke(&lambda.InvokeInput{
              FunctionName: aws.String("my-function"),
              Payload:      []byte(`{"path": "/users"}`),
          })
          
          // Don't test against deployed endpoints
          resp, err := http.Post("https://api.example.com/users", ...)
  
  configuration:
    name: "Application Configuration Pattern"
    problem: "Lambda functions need environment-specific config"
    solution: "Use lift.New with Config struct"
    correct_example: |
      import (
          "os"
          "time"
          "github.com/aws/aws-lambda-go/lambda"
          "github.com/pay-theory/lift/pkg/lift"
          "github.com/pay-theory/lift/pkg/middleware"
      )
      
      func main() {
          app := lift.New(
              // Configure via Config struct
              lift.WithConfig(&lift.Config{
                  Timeout:        25, // seconds (less than Lambda timeout)
                  MaxRequestSize: 5 * 1024 * 1024, // 5MB
                  LogLevel:       os.Getenv("LOG_LEVEL"),
                  Debug:          os.Getenv("ENVIRONMENT") != "production",
                  MetricsEnabled: true,
                  TracingEnabled: os.Getenv("ENVIRONMENT") == "production",
              }),
              
              // Custom logger
              lift.WithLogger(createLogger()),
          )
          
          // Middleware based on environment
          if os.Getenv("ENVIRONMENT") == "production" {
              app.Use(middleware.LimitedRateLimit(middleware.LimitedConfig{
                  Region: os.Getenv("AWS_REGION"),
                  Limit:  1000,
                  Window: time.Hour,
              }))
              app.Use(middleware.SecurityHeaders())
          } else {
              app.Use(middleware.DebugLogger())
          }
          
          lambda.Start(app.HandleRequest)
      }
    anti_patterns:
      - name: "Hard-coded Configuration"
        why: "Not flexible across environments"
        incorrect_example: |
          app := lift.New()
          // Don't hardcode configuration values
          app.config.Timeout = 30
          app.config.MaxRequestSize = 10 * 1024 * 1024
          
          // Don't hardcode environment values
          app.Use(middleware.JWT(middleware.JWTConfig{
              Secret: "my-secret-key", // Use environment variables!
          }))
