# _concepts.yaml - Machine-readable concept map for Lift Framework
# This file helps AI assistants understand the semantic relationships in Lift

concepts:
  lift:
    type: framework
    language: go
    purpose: AWS Lambda development with type safety
    tagline: "Type-safe serverless framework for AWS Lambda in Go"
    provides:
      - type_safe_handlers
      - automatic_error_handling
      - structured_logging
      - sns_error_notifications
      - distributed_tracing
      - request_validation
      - multi_tenant_support
      - middleware_system
      - ip_authorization
      - event_source_adapters
      - websocket_support
      - response_streaming
      - cdk_constructs
      - testing_utilities
      - durable_eventbus
    replaces:
      - raw_lambda_handlers
      - gin_on_lambda
      - echo_on_lambda
      - custom_middleware_implementations
    use_when:
      - building_aws_lambda_functions
      - need_production_grade_features
      - want_type_safety_in_serverless
      - building_multi_tenant_saas
      - need_consistent_error_handling
      - want_reduced_boilerplate
    dont_use_when:
      - not_using_aws_lambda
      - need_custom_runtime
      - using_languages_other_than_go
      - building_traditional_web_apps
    
  context:
    type: core_component
    purpose: unified request/response interface
    provides:
      - request_parsing
      - response_building
      - tenant_isolation
      - user_context
      - logging_access
      - tracing_support
    key_methods:
      - Bind: parse and validate request body
      - JSON: send JSON response
      - Param: get path parameter
      - Query: get query parameter
      - TenantID: get current tenant
      - UserID: get current user
      - Logger: access structured logger
    replaces:
      - manual_json_parsing
      - raw_event_access
      - custom_response_building
  
  handlers:
    type: pattern
    subtypes:
      simple_handler:
        signature: "func(ctx *Context, req T) (R, error)"
        provides:
          - automatic_request_parsing
          - automatic_validation
          - type_safe_responses
          - compile_time_checking
        use_when:
          - have_structured_request_response
          - want_type_safety
          - need_validation
      basic_handler:
        signature: "func(ctx *Context) error"
        provides:
          - flexible_handling
          - manual_parsing_control
        use_when:
          - complex_request_handling
          - dynamic_response_types
          - websocket_handlers
  
  middleware:
    type: component_system
    purpose: composable cross-cutting concerns
    standard_stack:
      - RequestID: generates unique request identifier
      - Logger: structured logging with request context
      - Recover: panic recovery and error response
      - ErrorHandler: consistent error formatting
    categories:
      observability:
        - Logger
        - Tracer
        - Metrics
        - EnhancedObservability
      security:
        - JWT
        - CORS
        - RateLimit
        - SecurityHeaders
        - IPAuthorization
      utility:
        - RequestID
        - Recover
        - ErrorHandler
        - Timeout
        - Validation
        - FeatureFlags
      resilience:
        - Idempotency
        - CircuitBreaker
        - Bulkhead
        - LoadShedding
        - Retry
      websocket:
        - WebSocketAuth
        - WebSocketMetrics
    composition_rules:
      - RequestID_before_Logger
      - Recover_before_business_logic
      - Auth_before_authorization
      - RateLimit_after_auth

  sns_error_notifications:
    type: feature
    purpose: publish error logs to an SNS topic for proactive alerting
    provides:
      - sns_publishing_on_error_logs
      - environment_based_configuration
      - partner_topic_convention_support
    configuration:
      - ERROR_NOTIFICATION_SNS_TOPIC_ARN
      - PARTNER
      - STAGE
      - AWS_REGION
      - AWS_ACCOUNT_ID
    key_methods:
      - zap.WithEnvironmentErrorNotifications: read topic ARN from ERROR_NOTIFICATION_SNS_TOPIC_ARN
      - zap.WithErrorNotifications: configure an explicit topic ARN
      - zap.WithPartnerErrorNotifications: construct topic ARN from partner/stage (+ AWS account auto-detection)
    iam_requirements:
      - "sns:Publish"
      - "sts:GetCallerIdentity (optional)"
    related_docs:
      - docs/sns-error-notifications.md
      - docs/aws-account-id-auto-detection.md
      - docs/migration-sns-error-notifications.md

  aws_account_id_auto_detection:
    type: utility
    purpose: resolve AWS account ID for partner-scoped SNS topic ARNs
    strategy:
      - env_var: AWS_ACCOUNT_ID
      - fallback: "STS GetCallerIdentity"
    caching: process_lifetime
    related_docs:
      - docs/aws-account-id-auto-detection.md

  ip_authorization:
    type: feature
    purpose: restrict requests based on caller IP allowlists
    provides:
      - ip_gating_middleware
      - source_ip_extraction
      - safe_initialization_patterns
    key_methods:
      - security.NewIPAuthorizationServiceFromEnv: load allowlist configuration from environment/SSM
      - security.ExtractClientIP: determine caller IP from API Gateway headers/context
    common_failure_modes:
      - init_time_panics
      - missing_partner_stage_env
      - misconfigured_proxy_headers
    related_docs:
      - docs/ip-gating-and-error-handling.md
  
  event_adapters:
    type: integration_layer
    purpose: unified interface for AWS event sources
    supported_sources:
      api_gateway:
        versions: [v1, v2]
        use_case: HTTP APIs
      sqs:
        use_case: async message processing
      s3:
        use_case: file processing triggers
      eventbridge:
        use_case: scheduled tasks and event routing
      dynamodb_streams:
        use_case: data change processing
      websocket:
        use_case: real-time connections
    pattern: "Adapter wraps event-specific handler with Context"
  
  cdk_constructs:
    type: infrastructure_as_code
    purpose: AWS CDK constructs for Lift applications
    provides:
      - lift_function_constructs
      - api_gateway_integration
      - rest_api_v1_integration
      - response_streaming_integration
      - websocket_api_support
      - cloudfront_static_frontends
      - cloudfront_media_cdn
      - middleware_enabled_deployments
      - security_by_default
      - operational_excellence
    constructs:
      - LiftFunction: base Lambda function construct
      - LiftAPI: API Gateway HTTP API (v2) integration
      - LiftRestAPI: API Gateway REST API (v1) integration
      - LiftWebSocketAPI: WebSocket API Gateway support
      - RateLimitedLiftFunction: rate limiting enabled functions
      - EventBusTable: DynamoDB table for EventBus
      - EventBusProcessor: DynamoDB stream processor wiring for EventBus
      - EventBusScheduler: EventBridge schedule wiring for delayed publish
      - StaticSite: S3 + CloudFront static site (OAC, Route53, ACM)
      - FrontendDistribution: single-host UI + API proxy distribution
      - MediaCDN: media-friendly CloudFront distribution (optional private media)
      - HostRedirect: CloudFront Function host redirect (308)
    features:
      - automatic_iam_roles
      - xray_tracing_enabled
      - cloudwatch_logs_retention
      - dead_letter_queue_configuration
      - waf_integration_options
  
  multi_tenancy:
    type: feature_set
    purpose: SaaS application support
    provides:
      - tenant_isolation
      - user_context
      - account_hierarchy
      - automatic_scoping
    implementation:
      - jwt_claims_extraction
      - header_based_tenancy
      - context_propagation
      - middleware_enforcement
  
  websocket:
    type: feature_set
    purpose: real-time bidirectional communication
    provides:
      - connection_management
      - route_selection
      - message_handling
      - connection_store_integration
    connection_lifecycle:
      - CONNECT: initial connection establishment
      - MESSAGE: message processing
      - DISCONNECT: connection cleanup
    features:
      - automatic_connection_management
      - dynamodb_connection_store
      - websocket_specific_middleware
      - connection_scoping_by_tenant
    middleware:
      - WebSocketAuth: authentication for WebSocket connections
      - WebSocketMetrics: metrics collection for WebSocket events

  eventbus:
    type: feature_set
    purpose: durable event bus for serverless workloads
    provides:
      - dynamodb_persisted_events
      - time_ordered_event_ids
      - multi_tenant_queries
      - batch_publish
      - idempotent_publish
      - optional_stream_processing
      - scheduled_events
      - lease_based_draining
      - quarantine_and_replay
      - consumer_checkpointing
      - websocket_fanout_helpers
      - governance_tags
    implementation:
      - services.EventBus: interface for publish/query/get/delete
      - services.DynamoDBEventBus: DynamORM-backed DynamoDB implementation
      - services.MemoryEventBus: in-memory test implementation
    docs:
      - docs/eventbus-guide.md

  response_streaming:
    type: feature_set
    purpose: long-lived HTTP responses that stream incremental data
    provides:
      - server_sent_events
      - incremental_progress_updates
      - long_poll_replacement
    requires:
      - api_gateway_rest_api_v1_streaming_integration
      - lambda_response_streaming_build
    implementation:
      - lift.SSEResponse: configure SSE streaming response
      - lift.SSEEvent: represent SSE frames
    use_when:
      - need_one_way_server_to_client_stream
      - need_sse_in_browser_clients
      - need_up_to_15_minute_streaming_timeout
    dont_use_when:
      - need_bidirectional_messaging
      - need_durable_fanout_or_background_work
      - only_http_api_v2_available
  
  validation:
    type: feature
    mechanism: struct_tags
    library: custom_validation_system
    provides:
      - declarative_validation
      - automatic_enforcement
      - detailed_error_messages
    common_tags:
      - required: field must be present
      - email: valid email format
      - min: minimum value/length
      - max: maximum value/length
      - oneof: enumerated values
      - url: valid URL format
      - omitempty: skip validation if field is empty
  
  error_handling:
    type: system
    philosophy: explicit_is_better
    components:
      lift_error:
        fields: [status_code, message, details]
        purpose: structured API errors
      error_middleware:
        purpose: consistent error responses
        features:
          - sanitization
          - logging
          - status_mapping
    patterns:
      - return_errors_dont_panic
      - use_lift_errors_for_api_responses
      - log_errors_with_context
      - never_expose_internals
  
  testing:
    type: utilities
    package: pkg/testing
    provides:
      - test_app_creation
      - test_context_building
      - request_simulation
      - response_assertion
    patterns:
      - unit_test_handlers
      - integration_test_middleware
      - mock_aws_services
      - table_driven_tests
  
  performance:
    type: characteristics
    cold_start_overhead: 1ms
    warm_performance: <1ms
    memory_overhead: 1KB
    binary_size: measured_at_runtime
    optimizations:
      - context_pooling
      - lazy_parsing
      - minimal_dependencies
      - efficient_routing
      - reflection_based_handler_conversion
    comparison:
      vs_raw_lambda:
        cold_start: +1ms
        features: +comprehensive
        code_reduction: 80%
      vs_web_frameworks:
        cold_start: -50%
        binary_size: -30%
        lambda_native: true
