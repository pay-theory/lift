# golangci-lint configuration for Lift and CDK code

run:
  timeout: 5m
  tests: true
  build-tags:
    - cdk
  skip-dirs:
    - vendor
    - third_party
    - testdata
    - examples
    - dist
  skip-files:
    - ".*_test.go"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable-all: false
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    
    # Additional linters for code quality
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - nakedret
    - prealloc
    - gocritic
    - gochecknoinits
    - gochecknoglobals
    - gocognit
    - godot
    - godox
    - goerr113
    - nestif
    - nolintlint
    - whitespace
    
    # Security linters
    - gosec
    
    # CDK-specific
    - dupl
    - funlen
    - gocyclo

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    
  govet:
    check-shadowing: true
    enable-all: true
    
  gofmt:
    simplify: true
    
  goimports:
    local-prefixes: github.com/pay-theory/lift
    
  gocyclo:
    min-complexity: 15
    
  dupl:
    threshold: 150
    
  funlen:
    lines: 100
    statements: 50
    
  goconst:
    min-len: 3
    min-occurrences: 3
    
  misspell:
    locale: US
    
  lll:
    line-length: 120
    tab-width: 4
    
  unused:
    check-exported: false
    
  unparam:
    check-exported: false
    
  nakedret:
    max-func-lines: 30
    
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
    
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - hugeParam
      - rangeValCopy
      - appendAssign
      - commentedOutCode
      
  gochecknoglobals:
    # Allow globals for CDK app initialization
    ignore-tests: true
    
  gocognit:
    min-complexity: 20
    
  godot:
    scope: declarations
    capital: true
    
  gosec:
    excludes:
      - G107 # URL construction - needed for API Gateway
      - G404 # Weak random - ok for non-security contexts
      
  nestif:
    min-complexity: 4
    
  nolintlint:
    allow-unused: false
    allow-leading-space: false
    require-explanation: true
    require-specific: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  
  exclude-rules:
    # Exclude some linters from test files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen
        - gocognit
        - gochecknoglobals
        
    # CDK-specific exclusions
    - path: pkg/cdk/
      linters:
        - gochecknoglobals # CDK apps often need globals
        - funlen           # CDK stack definitions can be long
      text: "Function 'New.*Stack' is too long"
      
    - path: pkg/cdk/constructs/
      linters:
        - dupl # Construct patterns are similar
        
    # Allow longer lines in CDK code for jsii method calls
    - path: pkg/cdk/
      linters:
        - lll
      source: "jsii\\."
      
    # Allow TODO/FIXME in CDK examples
    - path: pkg/cdk/examples/
      linters:
        - godox
        
    # Exclude specific patterns
    - text: "ST1003:" # Naming conventions - CDK uses specific patterns
      linters:
        - stylecheck
        
    - text: "exported .* should have comment" # CDK constructs are self-documenting
      path: pkg/cdk/
      linters:
        - golint
        - revive
        
  # Don't exclude issues about blank imports
  exclude-case-sensitive: false
  include-go-root: false
  
  # Show all issues
  max-issues: 0

severity:
  default-severity: error
  case-sensitive: false