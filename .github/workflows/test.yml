name: Test

on:
  push:
    branches: [ premain, main ]
  pull_request:
    branches: [ premain, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
    
    - name: Run benchmarks
      run: go test -bench=. -benchmem ./pkg/... || true

  cdk-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install AWS CDK
      run: npm install -g aws-cdk
    
    - name: Download Go dependencies
      run: go mod download
    
    - name: Test CDK constructs compilation
      run: |
        cd pkg/cdk/examples/basic-api
        go build -o /dev/null main.go
    
    - name: Synthesize CDK stacks
      run: |
        cd pkg/cdk/examples/basic-api
        cdk synth --quiet
    
    - name: Run CDK tests
      run: |
        go test -v ./pkg/cdk/...

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Build
      run: |
        GOOS=linux GOARCH=${{ matrix.arch }} go build -v ./...
    
    - name: Build examples
      run: |
        for example in examples/*/; do
          if [ -f "$example/main.go" ]; then
            echo "Building $example"
            cd "$example"
            GOOS=linux GOARCH=${{ matrix.arch }} go build -o bootstrap main.go
            cd -
          fi
        done